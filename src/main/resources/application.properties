spring.application.name=voting-backend

# 1. Database Location
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/voting_db}

# 2. Login Credentials
spring.datasource.username=${DB_USERNAME:sunny}
spring.datasource.password=${DB_PASSWORD:root}

# Server Port (Cloud providers dynamically assign ports!)
server.port=${PORT:8081}

# 3. Driver Config
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 4. Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 5. JWT configuration
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration=${JWT_EXPIRATION:36000000}